name: cd

on:
  push:
    branches: [main]
    
jobs:
    deploy:
      name: Deploy
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v6

        - name: Set up Go
          uses: actions/setup-go@v6
          with:
            go-version: "1.27.1"

        - name: build app
          run: scripts/buildprod.sh
        
        - id: 'auth'
          uses: 'google-github-actions/auth@v2'
          with:
            credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

        - name: 'Set up Cloud SDK'
          uses: 'google-github-actions/setup-gcloud@v3'

        - name: 'Use gcloud CLI'
          run: 'gcloud info'

        - name: Submit image to docker
          run : 'gcloud builds submit --tag europe-west6-docker.pkg.dev/notely-507817/notely-ar-repo/notely:latest .'

        - name: Deploy to Cloud Run
          run: gcloud run deploy notely --image europe-west6-docker.pkg.dev/notely-507817/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project notely-507817 --max-instances=4  
        
